<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Geneva GeoGuesser — How to play</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body { overflow-y: auto; height: auto; min-height: 100vh; }

    .tutorial-page {
      max-width: 640px;
      margin: 0 auto;
      padding: 4rem 2rem 6rem;
      display: flex;
      flex-direction: column;
      gap: 2.5rem;
    }

    .tut-header { display: flex; flex-direction: column; gap: 0.5rem; }
    .tut-title {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: -2px;
      line-height: 1;
    }
    .tut-title span { color: var(--accent); }
    .tut-subtitle {
      font-family: 'DM Mono', monospace;
      font-size: 0.85rem;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .tut-steps { display: flex; flex-direction: column; gap: 1.5rem; }
    .tut-step {
      display: flex;
      gap: 1.25rem;
      align-items: flex-start;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem 1.5rem;
    }
    .tut-step-num {
      font-size: 2rem;
      font-weight: 800;
      color: var(--accent);
      line-height: 1;
      letter-spacing: -1px;
      min-width: 2rem;
    }
    .tut-step-body { display: flex; flex-direction: column; gap: 0.35rem; }
    .tut-step-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
    }
    .tut-step-desc {
      font-family: 'DM Mono', monospace;
      font-size: 0.82rem;
      color: var(--muted);
      line-height: 1.6;
    }

    .tut-scoring {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .tut-scoring-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
    }
    .tut-scoring-row {
      display: flex;
      justify-content: space-between;
      font-family: 'DM Mono', monospace;
      font-size: 0.82rem;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.5rem;
    }
    .tut-scoring-row:last-child { border-bottom: none; padding-bottom: 0; }
    .tut-scoring-val { color: var(--accent); font-weight: 700; }

    .tut-tips {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .tut-tips-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 0.25rem;
    }
    .tut-tip {
      font-family: 'DM Mono', monospace;
      font-size: 0.82rem;
      color: var(--muted);
      display: flex;
      gap: 0.75rem;
    }
    .tut-tip::before { content: '→'; color: var(--accent); }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.85rem 2.5rem;
      background: var(--accent);
      color: #0d0f0e;
      border: none;
      border-radius: 8px;
      font-family: 'Syne', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.15s;
      align-self: flex-start;
    }
    .back-btn:hover { opacity: 0.85; }
  </style>
</head>
<body>

<!-- LANGUAGE TOGGLE -->
<div class="lang-toggle">
  <button class="lang-btn active" data-lang="en" onclick="setTutLang('en')">EN</button>
  <button class="lang-btn" data-lang="fr" onclick="setTutLang('fr')">FR</button>
</div>

<div class="tutorial-page">

  <div class="tut-header">
    <div class="tut-title">Geneva<span>.</span><br/>GeoGuesser</div>
    <div class="tut-subtitle" id="tut-subtitle">How to play</div>
  </div>

  <div class="tut-steps" id="tut-steps">
    <!-- filled by JS -->
  </div>

  <div class="tut-scoring">
    <div class="tut-scoring-title" id="tut-scoring-title">Scoring</div>
    <div class="tut-scoring-row">
      <span id="score-row-1-label">Spot on (0–50 m)</span>
      <span class="tut-scoring-val">1000 pts</span>
    </div>
    <div class="tut-scoring-row">
      <span id="score-row-2-label">Close (50–500 m)</span>
      <span class="tut-scoring-val">500–950 pts</span>
    </div>
    <div class="tut-scoring-row">
      <span id="score-row-3-label">Far (500–3000 m)</span>
      <span class="tut-scoring-val">0–500 pts</span>
    </div>
    <div class="tut-scoring-row">
      <span id="score-row-4-label">Over 3 km away</span>
      <span class="tut-scoring-val">0 pts</span>
    </div>
  </div>

  <div class="tut-tips">
    <div class="tut-tips-title" id="tut-tips-title">Tips</div>
    <div id="tut-tips-list">
      <!-- filled by JS -->
    </div>
  </div>

  <a class="back-btn" href="index.html" id="back-btn">← Back to game</a>

</div>

<script>
  const TUT = {
    en: {
      subtitle: 'How to play',
      scoringTitle: 'Scoring',
      tipsTitle: 'Tips',
      backBtn: '← Back to game',
      scoreRows: [
        ['Spot on (0–50 m)', '1000 pts'],
        ['Close (50–500 m)', '500–950 pts'],
        ['Far (500–3000 m)', '0–500 pts'],
        ['Over 3 km away', '0 pts'],
      ],
      steps: [
        { title: 'Choose your zone', desc: 'Pick a neighbourhood like Les Charmilles or Saint-Jean, or go for All Geneva for a wider challenge.' },
        { title: 'Look around in Street View', desc: 'You\'ll be dropped somewhere in the zone. Drag to look around, click the arrows to move through the streets.' },
        { title: 'Find your location', desc: 'Use signs, architecture, landmarks, and street names to figure out where you are. Don\'t forget to look at the mini-map for the neighbourhood boundary outline.' },
        { title: 'Place your guess', desc: 'Click on the mini-map in the bottom right to drop your pin. You can hover over it to make it bigger. Once you\'re happy, click "Place your guess".' },
        { title: 'See your score', desc: 'The closer your pin is to the real location, the more points you get. Up to 1000 per round, 5000 total.' },
        { title: 'Easy mode', desc: 'Enable Easy mode on the start screen to see a yellow hint circle on the map showing roughly where you are.' },
      ],
      tips: [
        'Look for street name signs — Geneva streets are well labelled.',
        'Architecture style changes between neighbourhoods.',
        'The Rhône and Arve rivers are great landmarks.',
        'Tram lines and bus stops often have neighbourhood names on them.',
        'Zoom into the mini-map by hovering over it before placing your guess.',
      ],
    },
    fr: {
      subtitle: 'Comment jouer',
      scoringTitle: 'Système de points',
      tipsTitle: 'Conseils',
      backBtn: '← Retour au jeu',
      scoreRows: [
        ['Parfait (0–50 m)', '1000 pts'],
        ['Proche (50–500 m)', '500–950 pts'],
        ['Loin (500–3000 m)', '0–500 pts'],
        ['Plus de 3 km', '0 pts'],
      ],
      steps: [
        { title: 'Choisir une zone', desc: 'Sélectionne un quartier comme Les Charmilles ou Saint-Jean, ou choisis Tout Genève pour un défi plus large.' },
        { title: 'Explorer Street View', desc: 'Tu atterris quelque part dans la zone. Fais glisser pour regarder autour de toi, clique sur les flèches pour te déplacer dans les rues.' },
        { title: 'Trouver ta position', desc: 'Utilise les panneaux, l\'architecture, les monuments et les noms de rues pour savoir où tu es. Regarde la mini-carte pour voir les contours du quartier.' },
        { title: 'Placer ta réponse', desc: 'Clique sur la mini-carte en bas à droite pour poser ton repère. Passe la souris dessus pour l\'agrandir. Quand tu es prêt, clique sur "Placer ma réponse".' },
        { title: 'Voir ton score', desc: 'Plus ton repère est proche de l\'endroit réel, plus tu gagnes de points. Jusqu\'à 1000 par manche, 5000 au total.' },
        { title: 'Mode facile', desc: 'Active le mode facile sur l\'écran de démarrage pour voir un cercle jaune indicatif sur la carte montrant approximativement où tu te trouves.' },
      ],
      tips: [
        'Cherche les plaques de rue — Genève est bien indiquée.',
        'Le style architectural change selon les quartiers.',
        'Le Rhône et l\'Arve sont de bons repères.',
        'Les lignes de tram et arrêts de bus portent souvent le nom du quartier.',
        'Agrandis la mini-carte en passant la souris dessus avant de placer ton repère.',
      ],
    },
  };

  let tutLang = 'en';

  function setTutLang(l) {
    tutLang = l;
    document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === l));
    renderTutorial();
  }

  function renderTutorial() {
    const d = TUT[tutLang];
    document.getElementById('tut-subtitle').textContent = d.subtitle;
    document.getElementById('tut-scoring-title').textContent = d.scoringTitle;
    document.getElementById('tut-tips-title').textContent = d.tipsTitle;
    document.getElementById('back-btn').textContent = d.backBtn;

    // Score rows
    const rowIds = ['score-row-1-label','score-row-2-label','score-row-3-label','score-row-4-label'];
    d.scoreRows.forEach((row, i) => {
      document.getElementById(rowIds[i]).textContent = row[0];
    });

    // Steps
    const stepsEl = document.getElementById('tut-steps');
    stepsEl.innerHTML = d.steps.map((s, i) => `
      <div class="tut-step">
        <div class="tut-step-num">${i + 1}</div>
        <div class="tut-step-body">
          <div class="tut-step-title">${s.title}</div>
          <div class="tut-step-desc">${s.desc}</div>
        </div>
      </div>`).join('');

    // Tips
    const tipsEl = document.getElementById('tut-tips-list');
    tipsEl.innerHTML = d.tips.map(tip => `<div class="tut-tip">${tip}</div>`).join('');
  }

  renderTutorial();
</script>

</body>
</html>
